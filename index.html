<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a5f4a" />
    <meta
      name="description"
      content="認識各國 — Learn many different country names in Chinese and English, and the seven continents"
    />
    <meta property="og:title" content="認識各國 · Know Different Countries by sley" />
    <meta
      property="og:description"
      content="一起認識世界各地嘅國家。Learn many different countries in 香港中文 and English."
    />
    <meta
      property="og:image"
      content="https://kingsleykwan.github.io/country_name/assets/social-preview.jpg?v=2"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kingsleykwan.github.io/country_name/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="認識各國 · Know Different Countries by sley" />
    <meta
      name="twitter:description"
      content="一起認識世界各地嘅國家。Learn many different countries in 香港中文 and English."
    />
    <meta
      name="twitter:image"
      content="https://kingsleykwan.github.io/country_name/assets/social-preview.jpg?v=2"
    />
    <title>認識各國 · Know Different Countries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="bg-atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand-block">
        <p class="brand" id="brand">認識國家</p>
        <p class="tagline" id="tagline">一起學國家名稱同七大洲</p>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="zh-HK" id="btnZh">
          中文
        </button>
        <button type="button" class="lang-btn" data-lang="en" id="btnEn">EN</button>
      </div>
    </header>

    <main class="app">
      <!-- Home: continents including All -->
      <section id="view-home" class="view is-active" aria-labelledby="brand">
        <div class="mode-panel">
          <p class="mode-hint" id="modeHint"></p>
          <div class="mode-toggle" role="group" aria-label="Country list size">
            <button type="button" class="mode-btn is-active" id="btnModeKids" data-mode="kids">
              常見國家(或地區)
            </button>
            <button type="button" class="mode-btn" id="btnModeAll" data-mode="all">
              所有國家
            </button>
          </div>
          <button type="button" class="btn-assignment" id="btnAssignment">
            <span class="btn-assignment-title" id="assignmentTitle">開始作業</span>
            <span class="btn-assignment-sub" id="assignmentSub"></span>
          </button>
        </div>
        <div class="continent-grid" id="continentGrid"></div>
      </section>

      <!-- Browse list -->
      <section id="view-browse" class="view" hidden>
        <div class="view-toolbar">
          <button type="button" class="btn-text" id="browseBack" data-action="home">
            ← <span data-i18n="back">返回</span>
          </button>
          <h2 class="view-title" id="browseTitle"></h2>
          <button type="button" class="btn-primary btn-compact" id="goPractice">
            <span data-i18n="practice">練習</span>
          </button>
        </div>
        <label class="search-wrap">
          <span class="sr-only" data-i18n="searchPlaceholder">搜尋國家名稱…</span>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            autocomplete="off"
            enterkeyhint="search"
          />
        </label>
        <ul class="country-list" id="countryList"></ul>
        <p class="empty-state" id="browseEmpty" hidden></p>
      </section>

      <!-- Country detail: flag + map -->
      <section id="view-detail" class="view" hidden>
        <div class="view-toolbar">
          <button type="button" class="btn-text" id="detailBack">
            ← <span data-i18n="back">返回</span>
          </button>
          <h2 class="view-title" id="detailTitle"></h2>
          <span class="toolbar-spacer"></span>
        </div>
        <div class="detail-hero">
          <div class="detail-block">
            <p class="detail-label" id="detailNameLabel"></p>
            <p class="detail-primary" id="detailPrimary"></p>
            <p class="detail-secondary" id="detailSecondary"></p>
            <p class="detail-note" id="detailNote" hidden></p>
          </div>
          <div class="detail-block">
            <p class="detail-label" id="detailFlagLabel"></p>
            <img class="detail-flag" id="detailFlag" alt="" width="200" height="150" />
          </div>
          <div class="detail-block">
            <p class="detail-label" id="detailContinentLabel"></p>
            <p class="detail-continent" id="detailMeta"></p>
          </div>
        </div>
        <h3 class="map-heading" id="detailMapHeading"></h3>
        <div class="map-frame">
          <div id="detailMap" class="earth-map" role="img" aria-label="World map"></div>
          <p class="map-status" id="detailMapStatus"></p>
        </div>
      </section>

      <!-- Flashcards -->
      <section id="view-practice" class="view" hidden>
        <div class="view-toolbar">
          <button type="button" class="btn-text" id="practiceBack">
            ← <span data-i18n="back">返回</span>
          </button>
          <h2 class="view-title" id="practiceTitle"></h2>
          <button type="button" class="btn-primary btn-compact" id="goBrowse">
            <span data-i18n="browse">瀏覽</span>
          </button>
        </div>

        <p class="card-progress" id="cardProgress"></p>

        <button type="button" class="flashcard" id="flashcard" aria-live="polite">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <img class="flash-flag-img" id="flashFlagImg" alt="" width="160" height="120" />
              <span class="flash-name-prompt" id="flashNameFront" hidden></span>
              <span class="flash-hint" id="flashHint"></span>
              <span class="flash-continent" id="flashContinentFront"></span>
            </div>
            <div class="flashcard-face flashcard-back">
              <img
                class="flash-flag-img small"
                id="flashFlagImgBack"
                alt=""
                width="80"
                height="60"
              />
              <span class="flash-name-primary" id="flashNamePrimary"></span>
              <span class="flash-name-secondary" id="flashNameSecondary"></span>
              <span class="flash-continent" id="flashContinentBack"></span>
              <span class="flash-note" id="flashNote"></span>
            </div>
          </div>
        </button>

        <h3 class="map-heading" id="practiceMapHeading"></h3>
        <div class="map-frame map-frame-practice">
          <div id="practiceMap" class="earth-map" role="img" aria-label="World map"></div>
          <p class="map-status" id="practiceMapStatus"></p>
        </div>

        <div class="card-controls">
          <button type="button" class="btn-secondary" id="btnPrev">
            <span data-i18n="prev">上一個</span>
          </button>
          <button type="button" class="btn-secondary" id="btnShuffle">
            <span data-i18n="shuffle">打亂</span>
          </button>
          <button type="button" class="btn-primary" id="btnNext">
            <span data-i18n="next">下一個</span>
          </button>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="vendor/topojson-client.min.js"></script>
    <script src="data/countries.js"></script>
    <script src="data/geo.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
